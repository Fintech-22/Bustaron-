[pytest]
# `testpaths` so a bare `pytest` from the repo root collects exactly this suite and does not
# wander into node_modules or the scratch directories.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `-ra` prints a summary of non-passing tests, which is what a CI log needs.
addopts = -ra --strict-markers

filterwarnings =
    # Starlette's TestClient warns that httpx will be replaced by httpx2. It is a
    # dependency-direction notice from a pinned version, not something this suite controls,
    # so it is filtered rather than left to bury real warnings.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
